name: fork-check
on:
  push:
    branches: ['ci/*']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build idp-extraction (regenerates element templates, applies spotless)
        run: mvn -B -ntp -pl connectors/idp-extraction -am install -DskipTests -Djacoco.skip=true
      - name: Files the build changed
        run: git status --short -- . ':!.github' && git diff --stat -- . ':!.github'
      - name: Patch of the build's changes
        run: git add -A -- . ':!.github' && git diff --cached -- . ':!.github' > build.patch; wc -l build.patch
      - uses: actions/upload-artifact@v4
        with:
          name: build-patch
          path: build.patch
      - name: Test idp-extraction and the templates artifact
        run: set -o pipefail; mvn -B -ntp -pl connectors/idp-extraction,connectors/idp-extraction/element-templates-artifact test -Djacoco.skip=true 2>&1 | tee test.log
      - name: Summary
        if: always()
        run: grep -E "Tests run:|BUILD|ERROR|FAIL" test.log | tail -60
