name: fork-check
on:
  push:
    branches: ['ci/*']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install upstream modules (applies spotless formatting)
        run: mvn -B -ntp -pl connector-runtime/connector-runtime-core -am install -DskipTests -Djacoco.skip=true
      - name: Formatting changes spotless made to the commit
        run: git diff --stat -- . ':!.github' && git diff -- . ':!.github' | head -300
      - name: Test connector-runtime-core
        run: set -o pipefail; mvn -B -ntp -pl connector-runtime/connector-runtime-core test -Djacoco.skip=true 2>&1 | tee test.log
      - name: Summary
        if: always()
        run: grep -E "Tests run:|BUILD|ERROR|FAIL" test.log | tail -60
